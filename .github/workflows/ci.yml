name: CI
on:
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: dotnet build CobolCS.sln -m:1
      - run: dotnet format whitespace CobolCS.sln --verify-no-changes --no-restore
      - name: Archive build outputs
        shell: bash
        run: |
          find src tests tools -type d \( -name bin -o -name obj \) -prune -print0 |
            tar --null -T - -czf build-output.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.tar.gz
          compression-level: 0
          retention-days: 1

  test:
    needs: build
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: branch
            filter: FullyQualifiedName~CobolCS.IntegrationTests.BranchGenerationTests.
          - suite: regression-a
            filter: FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.&(FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestA|FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestB|FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestC|FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestD|FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestE|FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestF|FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestG|FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestH|FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestI|FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestJ|FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestK|FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestL|FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestM|FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestN|FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestO|FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.TestP)
          - suite: regression-b
            filter: FullyQualifiedName~CobolCS.IntegrationTests.RegressionTests.&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestA&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestB&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestC&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestD&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestE&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestF&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestG&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestH&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestI&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestJ&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestK&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestL&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestM&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestN&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestO&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.TestP
          - suite: generation
            filter: FullyQualifiedName~CobolCS.IntegrationTests.GenerationTests.
          - suite: workflows-a
            filter: FullyQualifiedName~CobolCS.IntegrationTests.ReadinessTests.|FullyQualifiedName~CobolCS.IntegrationTests.OwnershipTests.|FullyQualifiedName~CobolCS.IntegrationTests.ExternalWorkflowTests.|FullyQualifiedName~CobolCS.IntegrationTests.WorkflowTests.|FullyQualifiedName~CobolCS.IntegrationTests.ExplorationTests.|FullyQualifiedName~CobolCS.IntegrationTests.ScenarioPathTests.
          # CompletionWorkflowTests, BusinessComparisonTests and BusinessFourFixesTests are included in this complementary filter.
          # Includes BusinessAssistanceTests, BusinessExternalScaffoldTests, CharacterGenerationTests, InternalStubMetricsTests.
          - suite: workflows-b
            filter: FullyQualifiedName!~CobolCS.IntegrationTests.BranchGenerationTests.&FullyQualifiedName!~CobolCS.IntegrationTests.RegressionTests.&FullyQualifiedName!~CobolCS.IntegrationTests.GenerationTests.&FullyQualifiedName!~CobolCS.IntegrationTests.ReadinessTests.&FullyQualifiedName!~CobolCS.IntegrationTests.OwnershipTests.&FullyQualifiedName!~CobolCS.IntegrationTests.ExternalWorkflowTests.&FullyQualifiedName!~CobolCS.IntegrationTests.WorkflowTests.&FullyQualifiedName!~CobolCS.IntegrationTests.ExplorationTests.&FullyQualifiedName!~CobolCS.IntegrationTests.ScenarioPathTests.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install archive tools for offline acquisition tests
        shell: bash
        run: |
          if ! command -v unzip || ! command -v zipinfo; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends unzip
          fi
          command -v unzip
          command -v zipinfo
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - run: tar -xzf build-output.tar.gz
      - run: dotnet test tests/CobolCS.Tests --no-build
        if: matrix.suite == 'branch'
      - run: dotnet test tests/CobolCS.Frontend.Tests --no-build
        if: matrix.suite == 'branch'
      - name: Integration tests (${{ matrix.suite }})
        run: dotnet test tests/CobolCS.IntegrationTests --no-build --filter "$TEST_FILTER" --logger 'console;verbosity=normal' --logger 'trx;LogFileName=integration.trx' --results-directory TestResults
        env:
          TEST_FILTER: ${{ matrix.filter }}
          # 親環境による無効化で、製品側のパイプ待機対策の欠落を隠さない。
          MSBUILDDISABLENODEREUSE: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.suite }}-results
          path: TestResults/

  corpus:
    needs: build
    name: corpus (${{ matrix.corpus }}, ${{ matrix.shard }}/${{ matrix.parts }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { corpus: course, shard: 0, parts: 1 }
          - { corpus: fun, shard: 0, parts: 1 }
          - { corpus: db2, shard: 0, parts: 1 }
          - { corpus: carddemo, shard: 0, parts: 4 }
          - { corpus: carddemo, shard: 1, parts: 4 }
          - { corpus: carddemo, shard: 2, parts: 4 }
          - { corpus: carddemo, shard: 3, parts: 4 }
          - { corpus: bank, shard: 0, parts: 4 }
          - { corpus: bank, shard: 1, parts: 4 }
          - { corpus: bank, shard: 2, parts: 4 }
          - { corpus: bank, shard: 3, parts: 4 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - run: tar -xzf build-output.tar.gz
      - name: Fetch pinned non-GPL upstream
        run: dotnet run --project tools/CobolCS.Tools --no-build -- fetch --lock tests/public-corpus/${{ matrix.corpus }}.lock.json --root .cache/public-cobol-corpus/${{ matrix.corpus }}
      - name: Compare frozen IR hashes
        if: matrix.shard == 0
        run: dotnet test tests/CobolCS.Frontend.CorpusTests --no-build --filter "FullyQualifiedName~${{ matrix.corpus }}"
      - name: Generate and build corpus sources
        run: dotnet run --project tools/CobolCS.Tools --no-build -- evaluate --lock tests/public-corpus/${{ matrix.corpus }}.lock.json --root .cache/public-cobol-corpus/${{ matrix.corpus }} --out out/public-corpus/${{ matrix.corpus }} --build --shard-index ${{ matrix.shard }} --shard-count ${{ matrix.parts }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-corpus-${{ matrix.corpus }}-shard-${{ matrix.shard }}
          path: out/public-corpus/${{ matrix.corpus }}/summary.json

  corpus-verify:
    needs: [build, corpus]
    name: verify all corpus shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - run: tar -xzf build-output.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: public-corpus-*-shard-*
          path: corpus-shards
      - name: Merge and verify complete fixed corpora
        shell: bash
        run: |
          for corpus in course fun db2 carddemo bank; do
            mkdir -p "out/corpus-shards/$corpus"
            for part in corpus-shards/public-corpus-"$corpus"-shard-*; do
              cp -r "$part" "out/corpus-shards/$corpus/"
            done
            dotnet run --project tools/CobolCS.Tools --no-build -- merge-evaluations --lock "tests/public-corpus/$corpus.lock.json" --input "out/corpus-shards/$corpus" --out "out/public-corpus/$corpus/summary.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-corpus-merged-summaries
          path: out/public-corpus/*/summary.json
