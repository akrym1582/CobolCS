name: CI
on:
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: dotnet build CobolCS.sln -m:1
      - run: dotnet format whitespace CobolCS.sln --verify-no-changes --no-restore
      - name: Archive build outputs
        shell: bash
        run: |
          find src tests tools -type d \( -name bin -o -name obj \) -prune -print0 |
            tar --null -T - -czf build-output.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.tar.gz
          compression-level: 0
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - run: tar -xzf build-output.tar.gz
      - run: dotnet run --project tests/CobolCS.Tests --no-build
      - run: dotnet test tests/CobolCS.Frontend.Tests --no-build
      - run: dotnet test tests/CobolCS.IntegrationTests --no-build
        env:
          # 親環境による無効化で、製品側のパイプ待機対策の欠落を隠さない。
          MSBUILDDISABLENODEREUSE: '0'

  corpus:
    needs: build
    name: corpus (${{ matrix.corpus }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: mcr.microsoft.com/dotnet/sdk:10.0
    strategy:
      fail-fast: false
      matrix:
        corpus: [course, fun, carddemo, bank, db2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - run: tar -xzf build-output.tar.gz
      - name: Fetch pinned non-GPL upstream
        run: dotnet run --project tools/CobolCS.Tools --no-build -- fetch --lock tests/public-corpus/${{ matrix.corpus }}.lock.json --root .cache/public-cobol-corpus/${{ matrix.corpus }}
      - name: Compare frozen IR hashes
        run: dotnet test tests/CobolCS.Frontend.CorpusTests --no-build --filter "FullyQualifiedName~${{ matrix.corpus }}"
      - name: Generate and build corpus sources
        run: dotnet run --project tools/CobolCS.Tools --no-build -- evaluate --lock tests/public-corpus/${{ matrix.corpus }}.lock.json --root .cache/public-cobol-corpus/${{ matrix.corpus }} --out out/public-corpus/${{ matrix.corpus }} --build
      - name: Verify reviewed expectations and generated builds
        run: dotnet run --project tools/CobolCS.Tools --no-build -- verify out/public-corpus/${{ matrix.corpus }}/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-corpus-${{ matrix.corpus }}-summary
          path: out/public-corpus/${{ matrix.corpus }}/summary.json
