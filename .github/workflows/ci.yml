name: CI
on:
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet build CobolCS.sln -m:1
      - run: dotnet format whitespace CobolCS.sln --verify-no-changes --no-restore
      - run: dotnet run --project tests/CobolCS.Tests --no-build
      - run: python tests/regression.py
