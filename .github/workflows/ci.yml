name: CI
on:
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v4
      - name: Require an environment without Python
        run: |
          if command -v python || command -v python3; then exit 1; fi
          test -z "$(find src tests tools vendor -name '*.py' -o -name '*.pyc')"
      - run: dotnet build CobolCS.sln -m:1
      - run: dotnet format whitespace CobolCS.sln --verify-no-changes --no-restore
      - run: dotnet run --project tests/CobolCS.Tests --no-build
      - run: dotnet test tests/CobolCS.Frontend.Tests --no-build
      - run: dotnet test tests/CobolCS.IntegrationTests --no-build
        env:
          # 親環境による無効化で、製品側のパイプ待機対策の欠落を隠さない。
          MSBUILDDISABLENODEREUSE: '0'
      - name: Validate pinned public corpora
        shell: bash
        run: |
          for corpus in course fun carddemo bank db2; do
            dotnet run --project tools/CobolCS.Tools --no-build -- fetch --lock "tests/public-corpus/$corpus.lock.json" --root ".cache/public-cobol-corpus/$corpus"
            dotnet test tests/CobolCS.Frontend.CorpusTests --no-build --filter "FullyQualifiedName~$corpus"
            dotnet run --project tools/CobolCS.Tools --no-build -- evaluate --lock "tests/public-corpus/$corpus.lock.json" --root ".cache/public-cobol-corpus/$corpus" --out "out/public-corpus/$corpus" --build
            dotnet run --project tools/CobolCS.Tools --no-build -- verify "out/public-corpus/$corpus/summary.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-corpus-summaries
          path: out/public-corpus/*/summary.json
