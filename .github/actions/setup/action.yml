name: Prepare .NET validation
description: Prepare .NET 10, verify Python-free sources, and restore shared NuGet packages.
runs:
  using: composite
  steps:
    - name: Set up .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Require sources without Python
      shell: bash
      run: |
        test -z "$(find src tests tools vendor -name '*.py' -o -name '*.pyc')"
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'src/CobolCS.Cli/SourceBackend.Project.cs', 'src/CobolCS.Cli/SourceBackend.Testing.cs', 'src/CobolCS.Cli/SourceBackend.Workflow.cs') }}
        restore-keys: |
          nuget-${{ runner.os }}-${{ runner.arch }}-
